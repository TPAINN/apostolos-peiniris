<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Apostolos Peiniris — Full-stack developer. Hand-built portfolio. No framework, no build step.">
<title>Apostolos Peiniris</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140d07"/><stop offset="1" stop-color="#0b0907"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d98b4a"/><stop offset="1" stop-color="#f3c58f"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d98b4a"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#d98b4a" stop-opacity=".55"/><stop offset="1" stop-color="#d98b4a" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#f3c58f" stop-opacity=".45"/><stop offset="1" stop-color="#f3c58f" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #d98b4a)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<text x="1020" y="270" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="150" font-weight="800" fill="url(#g1)" opacity=".13">&lt;/&gt;</text><g class="float"><rect x="790" y="50" width="420" height="260" rx="18" fill="#17120d" stroke="url(#g1)" stroke-opacity=".7"/><circle cx="818" cy="76" r="6" fill="#ef4444"/><circle cx="840" cy="76" r="6" fill="#f59e0b"/><circle cx="862" cy="76" r="6" fill="#22c55e"/><rect x="830" y="112" width="150" height="10" rx="5" fill="#d98b4a" opacity="0.9"/><rect x="850" y="140" width="220" height="10" rx="5" fill="#fff" opacity="0.2"/><rect x="850" y="168" width="170" height="10" rx="5" fill="#fff" opacity="0.2"/><rect x="870" y="196" width="250" height="10" rx="5" fill="#f3c58f" opacity="0.9"/><rect x="850" y="224" width="120" height="10" rx="5" fill="#fff" opacity="0.2"/><rect x="830" y="252" width="90" height="10" rx="5" fill="#d98b4a" opacity="0.9"/><rect class="blink" x="1090" y="274" width="12" height="22" rx="2" fill="#d98b4a"/></g>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="63" font-weight="800" letter-spacing="-2" fill="url(#tt)">Apostolos Peiniris</text>
<text x="72" y="200" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">Full-stack developer. Hand-built portfolio. No</text><text x="72" y="232" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">framework, no build step.</text>
<g transform="translate(72 292)"><rect width="67" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#d98b4a" stroke-opacity=".45"/><text x="33" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">HTML</text></g><g transform="translate(149 292)"><rect width="58" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#d98b4a" stroke-opacity=".45"/><text x="29" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">CSS</text></g><g transform="translate(216 292)"><rect width="67" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#d98b4a" stroke-opacity=".45"/><text x="33" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">GSAP</text></g><g transform="translate(293 292)"><rect width="76" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#d98b4a" stroke-opacity=".45"/><text x="38" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Lenis</text></g>
<rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="url(#g1)" stroke-opacity=".35" stroke-width="1.5"/>
</g>
</svg>
